name: EVENTO Phone Dev APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: write

concurrency:
  group: evento-phone-dev
  cancel-in-progress: true

jobs:
  android-dev:
    name: Analyze, test and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout EVENTO
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Flutter 3.44.9 from official repository
        shell: bash
        run: |
          git clone --depth 1 --branch 3.44.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Generate Android platform wrapper
        shell: bash
        run: |
          flutter create --platforms=android --org ae.evento --project-name evento_mobile .

      - name: Restore stable EVENTO dev signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: evento-dev-debug-keystore-v1

      - name: Ensure dev signing key exists
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=EVENTO Dev,O=EVENTO,C=AE"
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

      - name: Build phone dev APK
        shell: bash
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://jaxhaiaftpegcodkzaus.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_DXERnH5OYjEcypugbP0FZA_nYwM9Tvt
          cp build/app/outputs/flutter-apk/app-debug.apk evento-dev.apk
          sha256sum evento-dev.apk | tee evento-dev.apk.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: evento-dev-apk
          path: |
            evento-dev.apk
            evento-dev.apk.sha256
          retention-days: 14
          if-no-files-found: error

      - name: Update permanent dev-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view dev-latest >/dev/null 2>&1; then
            git tag -f dev-latest "$GITHUB_SHA"
            git push origin -f dev-latest
            gh release upload dev-latest evento-dev.apk evento-dev.apk.sha256 --clobber
            gh release edit dev-latest \
              --title "EVENTO Dev Latest" \
              --notes "Phone-first Android development build. Built from ${GITHUB_SHA}. Install evento-dev.apk on the designated Android test phone."
          else
            gh release create dev-latest evento-dev.apk evento-dev.apk.sha256 \
              --target "$GITHUB_SHA" \
              --title "EVENTO Dev Latest" \
              --notes "Phone-first Android development build. Built from ${GITHUB_SHA}. Install evento-dev.apk on the designated Android test phone."
          fi
