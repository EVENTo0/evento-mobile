name: EVENTO Phone Dev APK (RC5)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: write

concurrency:
  group: evento-phone-dev-rc5
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.9'
  EVENTO_APPLICATION_ID: 'ae.evento.evento_mobile'
  EVENTO_DEV_CERT_SHA256: 'bac5a317acd9286aa346268daff0463dae653932f483845e129955de4d069a36'
  EVENTO_DEV_CERT_SHA256_COLON: 'BA:C5:A3:17:AC:D9:28:6A:A3:46:26:8D:AF:F0:46:3D:AE:65:39:32:F4:83:84:5E:12:99:55:DE:4D:06:9A:36'

jobs:
  android-dev:
    name: Validate RC5 and build phone update APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout EVENTO
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Flutter
        id: flutter_install
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter" 2>&1 | tee ci-logs/01-flutter.log
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" --version 2>&1 | tee -a ci-logs/01-flutter.log

      - name: Generate Android wrapper
        id: android_wrapper
        shell: bash
        run: |
          set -euo pipefail
          flutter create --no-pub --platforms=android --org ae.evento --project-name evento_mobile . 2>&1 | tee ci-logs/02-android-wrapper.log

      - name: Normalize legacy bootstrap for strict analysis
        id: source_normalize
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee ci-logs/02b-source-normalize.log
          from pathlib import Path
          legacy = Path('lib/main.dart')
          if legacy.exists():
              s = legacy.read_text()
              s = s.replace('anonKey: _supabasePublishableKey,', 'publishableKey: _supabasePublishableKey,')
              legacy.write_text(s)
          rc4 = Path('lib/rc4_app.dart')
          if rc4.exists():
              s = rc4.read_text().replace("import 'data/demo_analysis.dart';\n", '')
              rc4.write_text(s)
          print('Source normalization complete.')
          PY

      - name: Resolve dependencies
        id: pub_get
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get 2>&1 | tee ci-logs/03-pub-get.log

      - name: Verify RC5 source contract
        id: rc5_contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "evento-heuristic-v1.0-rc5" test/rc5_widget_test.dart
          grep -Fq "Upgrade analysis to bilingual RC5" lib/rc5_app.dart
          grep -Fq "summary_ar" lib/data/repositories/project_request_repository.dart
          grep -Fq "note_ar" lib/data/repositories/project_request_repository.dart
          echo "RC5 bilingual source contract verified." | tee ci-logs/03b-rc5-contract.log

      - name: Install persistent EVENTO dev signing identity
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 --decode tool/dev_signing/evento-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey 2>&1 | tee ci-logs/04-signing.log
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          marker = 'android {\n'
          block = '''android {
              signingConfigs {
                  create("eventoDev") {
                      storeFile = file(System.getProperty("user.home") + "/.android/debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
              buildTypes {
                  getByName("debug") {
                      signingConfig = signingConfigs.getByName("eventoDev")
                  }
              }
          '''
          if marker not in s:
              raise SystemExit('android block not found')
          if 'create("eventoDev")' not in s:
              p.write_text(s.replace(marker, block, 1))
          PY

      - name: Verify Gradle signing report
        id: signing_report
        shell: bash
        run: |
          set -euo pipefail
          (cd android && ./gradlew signingReport) 2>&1 | tee ci-logs/05-signing-report.log
          grep -Fq "$EVENTO_DEV_CERT_SHA256_COLON" ci-logs/05-signing-report.log
          grep -Fq 'Variant: debug' ci-logs/05-signing-report.log

      - name: Strict static analysis
        id: analyze
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze 2>&1 | tee ci-logs/06-analyze.log

      - name: Run all Flutter tests
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          flutter test --reporter expanded 2>&1 | tee ci-logs/07-tests.log

      - name: Generate monotonic Android version code
        id: version_code
        shell: bash
        run: |
          set -euo pipefail
          EVENTO_BUILD_NUMBER=$(( $(date -u +%s) / 10 ))
          test "$EVENTO_BUILD_NUMBER" -gt 178625293
          echo "EVENTO_BUILD_NUMBER=$EVENTO_BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Android versionCode: $EVENTO_BUILD_NUMBER" | tee ci-logs/08-version-code.log

      - name: Build RC5 update APK
        id: build
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug \
            -t lib/main_rc5.dart \
            --build-name "0.9.0-rc.5" \
            --build-number "$EVENTO_BUILD_NUMBER" \
            --dart-define=SUPABASE_URL=https://jaxhaiaftpegcodkzaus.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_DXERnH5OYjEcypugbP0FZA_nYwM9Tvt \
            2>&1 | tee ci-logs/09-build.log
          cp build/app/outputs/flutter-apk/app-debug.apk evento-dev.apk
          sha256sum evento-dev.apk | tee evento-dev.apk.sha256

      - name: Verify APK identity
        id: apk_verify
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          BADGING="$($AAPT dump badging evento-dev.apk | head -n 1)"
          echo "$BADGING" | tee ci-logs/10-apk-identity.log
          echo "$BADGING" | grep -q "package: name='$EVENTO_APPLICATION_ID'"
          APK_VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          test "$APK_VERSION_CODE" = "$EVENTO_BUILD_NUMBER"
          "$APKSIGNER" verify --print-certs evento-dev.apk 2>&1 | tee -a ci-logs/10-apk-identity.log
          CERT_DIGEST="$($APKSIGNER verify --print-certs evento-dev.apk 2>/dev/null | sed -n 's/^V2 Signer: certificate SHA-256 digest: //p; s/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test "$CERT_DIGEST" = "$EVENTO_DEV_CERT_SHA256"

      - name: Upload APK artifact
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: evento-dev-apk-rc5
          path: |
            evento-dev.apk
            evento-dev.apk.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Publish dev-latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES="EVENTO RC5 bilingual live phone update from ${GITHUB_SHA}. Adds Arabic/English server analysis, localized timeline/statuses, and safe re-analysis of older requests. Android versionCode ${EVENTO_BUILD_NUMBER}. Install as Update over the existing EVENTO app."
          if gh release view dev-latest >/dev/null 2>&1; then
            git tag -f dev-latest "$GITHUB_SHA"
            git push origin -f dev-latest
            gh release upload dev-latest evento-dev.apk evento-dev.apk.sha256 --clobber
            gh release edit dev-latest --title "EVENTO Dev Latest" --notes "$NOTES"
          else
            gh release create dev-latest evento-dev.apk evento-dev.apk.sha256 --target "$GITHUB_SHA" --title "EVENTO Dev Latest" --prerelease --notes "$NOTES"
          fi

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evento-rc5-diagnostics-${{ github.run_number }}
          path: ci-logs
          if-no-files-found: ignore
          retention-days: 14
