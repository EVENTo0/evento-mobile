name: EVENTO Mobile PR Verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.9'
  CI: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the existing pinned Flutter baseline
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
      - name: Resolve dependencies and verify source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          flutter --version | tee ci-logs/flutter-version.log
          flutter pub get --enforce-lockfile 2>&1 | tee ci-logs/pub-get.log
          flutter analyze 2>&1 | tee ci-logs/analyze.log
          EVENTO_WIDGET_EVIDENCE_DIR="$PWD/ci-logs/rendered-widget-fixtures" EVENTO_WIDGET_FONT="$RUNNER_TEMP/flutter/bin/cache/artifacts/material_fonts/Roboto-Regular.ttf" flutter test --reporter expanded 2>&1 | tee ci-logs/tests.log
          python3 -m unittest discover -s tool -p 'test_*.py'
      - name: Generate Android API 36 wrapper
        shell: bash
        run: |
          set -euo pipefail
          flutter create --no-pub --platforms=android --org ae.evento --project-name evento_mobile .
          python3 tool/configure_android_api36.py
          git restore --source=HEAD --worktree -- pubspec.lock
      - name: Build isolated demo APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug -t lib/main_rc6.dart 2>&1 | tee ci-logs/build.log
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging build/app/outputs/flutter-apk/app-debug.apk > ci-logs/apk-badging.log
          grep -Fq "targetSdkVersion:'36'" ci-logs/apk-badging.log
          sha256sum build/app/outputs/flutter-apk/app-debug.apk > ci-logs/apk.sha256
      - name: Build safe unconfigured ONE member APK at the exact PR head
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-apk
          flutter build apk --debug -t lib/main_one.dart 2>&1 | tee ci-logs/one-build.log
          cp build/app/outputs/flutter-apk/app-debug.apk ci-apk/evento-one-test-unconfigured-api36.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging ci-apk/evento-one-test-unconfigured-api36.apk > ci-logs/one-apk-badging.log
          grep -Fq "targetSdkVersion:'36'" ci-logs/one-apk-badging.log
          sha256sum ci-apk/evento-one-test-unconfigured-api36.apk > ci-logs/one-apk.sha256
          git rev-parse HEAD > ci-logs/source-head.txt
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          apk = pathlib.Path('ci-apk/evento-one-test-unconfigured-api36.apk')
          evidence = {
            'sourceSha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
            'target': 'lib/main_one.dart', 'mode': 'TEST_UNCONFIGURED', 'targetSdk': 36,
            'providerDefinesSupplied': False, 'signInEnabled': False, 'signing': 'Android debug only',
            'apkSha256': hashlib.sha256(apk.read_bytes()).hexdigest(),
            'limits': ['No hosted Auth/API or physical-device proof', 'Provider configuration requires a separate test build'],
          }
          pathlib.Path('ci-logs/one-apk-provenance.json').write_text(json.dumps(evidence, indent=2) + '\n')
          PY
      - name: Preserve unconfigured TEST APK for review
        uses: actions/upload-artifact@v7
        with:
          name: evento-one-TEST-unconfigured-API36-${{ github.event.pull_request.head.sha || github.sha }}
          path: ci-apk/evento-one-test-unconfigured-api36.apk
          retention-days: 7
          if-no-files-found: error
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-pr-evidence-${{ github.run_id }}
          path: ci-logs
          retention-days: 14
          if-no-files-found: warn
