name: EVENTO RC4 Build Monitor

on:
  workflow_run:
    workflows: ['EVENTO Phone Dev APK (RC4)']
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record RC4 build result
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          {
            echo '# EVENTO RC4 Build Status'
            echo
            echo "Run ID: $RUN_ID"
            echo "Commit: $HEAD_SHA"
            echo "Conclusion: $CONCLUSION"
            echo "Run: $RUN_URL"
            echo "Updated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > PHONE_BUILD_STATUS_RC4.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PHONE_BUILD_STATUS_RC4.md
          git commit -m 'ci: record RC4 build result [skip ci]' || exit 0
          git push
